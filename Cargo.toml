[package]
name = "zergraph"
version = "0.1.0"
edition = "2021"
description = "A small mergeable property graph with deterministic reads and portable snapshots."
repository = "https://github.com/bbopen/zergraph"
license-file = "LICENSE"
publish = false
include = ["src/**", "examples/**", "tests/**", "benches/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md", "docs/**"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "perf"
harness = false
