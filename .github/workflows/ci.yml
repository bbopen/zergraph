name: Library
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked
      - run: cargo test --locked --features serde_json/preserve_order
      - run: cargo run --locked --example evidence
      - run: cargo run --locked --example field_inspection
      - run: cargo run --locked --example swarm
      - run: cargo run --locked --example lineage
      - run: cargo run --locked --example repair
      - run: cargo package --locked
